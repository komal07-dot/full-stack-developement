<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upcoming Event</title>

<link rel="stylesheet" href="neww.css">

</head>
<body>

<header>

<nav>

<h2>FutureFest 2026</h2>

<button id="darkBtn">
🌙 Dark Mode
</button>

</nav>

<div class="hero">

<h1>Tech Conference 2026</h1>

<p>Join us on <b>10 July 2026</b></p>

<a href="#register">
<button class="btn">
Register Now
</button>
</a>

</div>

</header>

<section class="countdown">

<h2>Event Starts In</h2>

<div class="timer">

<div>
<span id="days">00</span>
<p>Days</p>
</div>

<div>
<span id="hours">00</span>
<p>Hours</p>
</div>

<div>
<span id="minutes">00</span>
<p>Minutes</p>
</div>

<div>
<span id="seconds">00</span>
<p>Seconds</p>
</div>

</div>

</section>

<section class="counter">

<div>

<h2 id="count1">0</h2>

<p>Participants</p>

</div>

<div>

<h2 id="count2">0</h2>

<p>Speakers</p>

</div>

<div>

<h2 id="count3">0</h2>

<p>Workshops</p>

</div>

</section>

<section id="register">

<h2>Register Here</h2>

<form id="eventForm">

<input type="text" id="name" placeholder="Enter Name">

<small id="nameError"></small>

<input type="email" id="email" placeholder="Enter Email">

<small id="emailError"></small>

<input type="tel" id="phone" placeholder="Enter Phone">

<small id="phoneError"></small>

<select id="course">

<option value="">Select Event</option>

<option>AI Workshop</option>

<option>Web Development</option>

<option>Cyber Security</option>

</select>

<small id="courseError"></small>

<button type="submit" class="btn">
Submit
</button>

</form>

</section>

<footer>

<p>© 2026 FutureFest</p>

</footer>

<script src="neww.js"></script>

</body>
</html>
