<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="work.css">
</head>

<body>

<h1>Registration</h1>
<script src="work.js"></script>


<h3>Personal Details</h3>

<form id="input form">

<label>Full Name</label><br>
<input type="text" placeholder="Enter your name"><br><br>

<label>Date of Birth</label><br>
<input type="date"><br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter your email"><br><br>

<label>Mobile Number</label><br>
<input type="tel" placeholder="Enter mobile number"><br><br>

<label>Gender</label><br>
<input type="text" placeholder="Enter your gender"><br><br>

<label>Occupation</label><br>
<input type="text" placeholder="Enter occupation"><br><br>

<h3>Identity Details</h3>

<label>ID Type</label><br>
<input type="text" placeholder="Enter ID type"><br><br>

<label>ID Number</label><br>
<input type="text" placeholder="Enter ID number"><br><br>

<label>Issue Authority</label><br>
<input type="text" placeholder="Enter issue authority"><br><br>

<label>Issue Date</label><br>
<input type="date"><br><br>

<label>Issue State</label><br>
<input type="text" placeholder="Enter issue state"><br><br>

<label>Expiry Date</label><br>
<input type="date"><br><br>

<button type="submit">Next →</button>

</form>

</body>
</html>
